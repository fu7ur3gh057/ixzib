<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ixzib</title>
<style>
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root{
    --blue:#4d9bff; --cyan:#5fe3ff; --violet:#9b6bff; --pink:#ff6fb5; --amber:#ffb366;
    --text:#eaf1ff; --dim:rgba(234,241,255,.55); --faint:rgba(234,241,255,.32);
    --glass:rgba(255,255,255,.07); --edge:rgba(255,255,255,.12);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
  #win{position:fixed;inset:0;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
       background:linear-gradient(180deg,rgba(14,17,32,.50),rgba(8,10,20,.62));border:1px solid var(--edge);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
  /* slow aurora behind everything, echoing the ribbon of the orb */
  #aurora{position:absolute;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55}
  #aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
  #aurora i:nth-child(1){width:55%;height:40%;left:5%;top:8%;background:var(--blue);opacity:.35;animation:f1 18s ease-in-out infinite alternate}
  #aurora i:nth-child(2){width:50%;height:38%;left:40%;top:30%;background:var(--violet);opacity:.30;animation:f2 22s ease-in-out infinite alternate}
  #aurora i:nth-child(3){width:45%;height:30%;left:20%;top:62%;background:var(--amber);opacity:.14;animation:f3 26s ease-in-out infinite alternate}
  @keyframes f1{to{transform:translate(18%,12%) scale(1.15)}} @keyframes f2{to{transform:translate(-20%,-10%) scale(.9)}} @keyframes f3{to{transform:translate(12%,-18%) scale(1.2)}}
  header,#log,#bar,#permBox{position:relative;z-index:1}

  header{display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px;-webkit-app-region:drag;border-bottom:1px solid rgba(255,255,255,.07)}
  .orb{--a:0deg;width:34px;height:34px;border-radius:50%;flex:none;position:relative;opacity:.55;
       background:conic-gradient(from var(--a),#3a8dff,#8f5bff,#ff8f55,#ffd27a,#3a8dff);
       box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 0 18px rgba(90,150,255,.35);
       animation:spin 10s linear infinite;transition:opacity .6s,transform .25s}
  .orb::after{content:"";position:absolute;inset:0;border-radius:50%;
       background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 42%),radial-gradient(circle at 50% 120%,rgba(0,0,0,.45),rgba(0,0,0,0) 60%)}
  @keyframes spin{to{--a:360deg}}
  .orb[data-s=listening]{opacity:1;animation-duration:3.5s;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 26px rgba(95,227,255,.7)}
  .orb[data-s=thinking]{opacity:1;animation-duration:2s;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 26px rgba(155,107,255,.75)}
  .orb[data-s=working]{opacity:1;animation-duration:2.6s;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 26px rgba(255,179,102,.7)}
  .orb[data-s=speaking]{opacity:1;animation-duration:4s;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 26px rgba(255,111,181,.7)}
  .orb[data-s=idle]{opacity:.7}
  .title{flex:1;min-width:0}
  .title b{display:block;font-size:15px;font-weight:600;letter-spacing:.2px}
  .title span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{-webkit-app-region:no-drag;width:28px;height:28px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--dim);
       display:grid;place-items:center;cursor:pointer;font-size:13px;transition:background .15s,color .15s}
  .btn:hover{background:rgba(255,255,255,.16);color:#fff} .btn.close:hover{background:rgba(255,95,100,.55)}

  #log{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;user-select:text}
  #log::-webkit-scrollbar{width:6px} #log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  .m{max-width:84%;animation:in .28s cubic-bezier(.2,.8,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(8px) scale(.98)}}
  .bub{padding:9px 13px;border-radius:17px;word-wrap:break-word;overflow-wrap:anywhere}
  .meta{font-size:11px;color:var(--faint);margin:3px 8px 0}
  .m.user{align-self:flex-end;text-align:left}
  .m.user .bub{background:linear-gradient(135deg,rgba(77,155,255,.34),rgba(130,90,255,.28));border:1px solid rgba(140,180,255,.28);border-bottom-right-radius:5px}
  .m.user .meta{text-align:right}
  .m.assistant{align-self:flex-start}
  .m.assistant .bub{background:var(--glass);border:1px solid var(--edge);border-bottom-left-radius:5px;
       box-shadow:0 0 0 1px rgba(155,107,255,.0),0 6px 24px rgba(0,0,0,.18)}
  .m.tool{align-self:flex-start;max-width:92%}
  .m.tool .bub{padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
       font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
  .m.system{align-self:center;max-width:92%}
  .m.system .bub{padding:3px 12px;border-radius:999px;background:rgba(255,179,102,.10);border:1px solid rgba(255,179,102,.22);color:#ffd9a8;font-size:12px}
  .bub p{margin:0 0 .5em}.bub p:last-child{margin:0}
  .bub code{font:12.5px ui-monospace,Menlo,monospace;background:rgba(255,255,255,.09);padding:1px 5px;border-radius:5px}
  .bub pre{margin:6px 0;padding:9px 11px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:11px;overflow-x:auto}
  .bub pre code{background:none;padding:0;white-space:pre}
  .bub ul{margin:.3em 0;padding-left:1.2em}.bub a,.bub .lnk{color:var(--cyan);text-decoration:underline;text-decoration-color:rgba(95,227,255,.4)}
  #empty{margin:auto;text-align:center;color:var(--dim);padding:20px}
  #empty .big{width:74px;height:74px;margin:0 auto 14px}
  #empty .big.orb{opacity:.9;width:74px;height:74px;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 0 40px rgba(110,140,255,.45)}
  #empty b{color:var(--text);font-weight:600}
  .typing{align-self:flex-start;display:flex;align-items:center;gap:9px;padding:6px 4px;color:var(--dim);font-size:12.5px}
  .dots{display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--violet);animation:dot 1.1s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
  @keyframes dot{0%,80%,100%{transform:scale(.55);opacity:.4}40%{transform:scale(1);opacity:1}}

  #permBox{display:none;margin:0 14px 8px;padding:11px 13px;border-radius:15px;background:rgba(255,179,102,.12);border:1px solid rgba(255,179,102,.32);animation:in .25s both}
  #permBox .t{font-size:12.5px;color:#ffe2bd;margin-bottom:8px;word-break:break-all}
  #permBox button{font:inherit;font-size:13px;border:0;border-radius:999px;padding:6px 16px;margin-right:8px;cursor:pointer;color:#06210f;background:#46e0a0;font-weight:600}
  #permBox button.no{background:#ff7b7f;color:#2a0507}

  #bar{display:flex;align-items:center;gap:8px;padding:10px 12px 14px}
  #field{flex:1;display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:4px 6px 4px 16px;transition:border-color .2s,box-shadow .2s}
  #field:focus-within{border-color:rgba(120,170,255,.55);box-shadow:0 0 0 3px rgba(80,140,255,.16),0 0 24px rgba(90,150,255,.18)}
  #inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:7px 0;user-select:text}
  #inp::placeholder{color:var(--faint)}
  .round{flex:none;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:15px;transition:transform .15s,filter .15s}
  .round:active{transform:scale(.92)}
  #send{background:linear-gradient(135deg,#4d9bff,#9b6bff)} #send:hover{filter:brightness(1.12)}
  #mic{background:var(--glass);border:1px solid var(--edge);width:42px;height:42px;font-size:17px} #mic:hover{background:rgba(255,255,255,.16)}
  #mic.on{background:linear-gradient(135deg,#2fd3c8,#4d9bff);box-shadow:0 0 22px rgba(95,227,255,.5);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{box-shadow:0 0 34px rgba(95,227,255,.8)}}
</style></head>
<body>
<div id="win">
  <div id="aurora"><i></i><i></i><i></i></div>
  <header>
    <div class="orb" id="orb" data-s="offline"></div>
    <div class="title"><b>Ixzib</b><span id="status">подключаюсь…</span></div>
    <div class="btn close" id="close" title="Закрыть окно (Esc)">✕</div>
  </header>
  <div id="log"></div>
  <div id="permBox"><div class="t" id="permText"></div><button id="yes">Разрешить</button><button class="no" id="no">Отклонить</button></div>
  <div id="bar">
    <button class="round" id="mic" title="Слушать">🎙</button>
    <div id="field"><input id="inp" placeholder="Напиши сообщение…" autocomplete="off" spellcheck="false"><button class="round" id="send" title="Отправить">↑</button></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), STATUS = { idle:'готов', listening:'слушаю…', thinking:'думаю…', working:'работаю…', speaking:'говорю…', offline:'нет связи с ядром' };
let ws = null, state = 'offline', label = '', perm = null, typingEl = null, userName = '';
const greet = () => userName ? `Привет, ${userName}` : 'Привет';

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(src){
  let t = esc(src);
  const blocks = [];
  t = t.replace(/```\w*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(`<pre><code>${c.replace(/\n$/,'')}</code></pre>`); return `\u0000${blocks.length-1}\u0000`; });
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  t = t.replace(/(https?:\/\/[^\s<)]+)/g, '<span class="lnk">$1</span>');
  const out = []; let list = [];
  const flush = () => { if(list.length){ out.push('<ul>' + list.map(x => `<li>${x}</li>`).join('') + '</ul>'); list = []; } };
  for(const ln of t.split('\n')){
    const m = ln.match(/^\s*[-*•]\s+(.*)/);
    if(m){ list.push(m[1]); } else { flush(); out.push(ln.trim() === '' ? '\u0001' : ln); }
  }
  flush();
  return out.join('\n').split(/\n?\u0001\n?/).filter(p => p.trim()).map(p => /^(<(ul|pre)|\u0000\d+\u0000$)/.test(p.trim()) ? p : `<p>${p.replace(/\n/g,'<br>')}</p>`).join('')
            .replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}
const hhmm = ts => new Date((ts || Date.now()/1000) * 1000).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });

function clearEmpty(){ const e = $('empty'); if(e) e.remove(); }
function showEmpty(){
  if($('empty')) return;
  const d = document.createElement('div'); d.id = 'empty';
  d.innerHTML = '<div class="orb big" data-s="idle"></div><b>' + esc(greet()) + '</b><br>скажи «Эй, Иксзиб» или напиши ниже';
  log.appendChild(d);
}
function nearBottom(){ return log.scrollHeight - log.scrollTop - log.clientHeight < 90; }
function toBottom(){ log.scrollTop = log.scrollHeight; }

function add(ev, scroll = true){
  clearEmpty();
  const stick = nearBottom();
  const role = ev.role || 'system';
  const el = document.createElement('div'); el.className = 'm ' + role;
  const b = document.createElement('div'); b.className = 'bub';
  if(role === 'assistant') b.innerHTML = md(ev.text || '');
  else if(role === 'tool') b.textContent = '⚙ ' + (ev.text || '');
  else b.textContent = ev.text || '';
  el.appendChild(b);
  if(role === 'user' || role === 'assistant'){
    const mt = document.createElement('div'); mt.className = 'meta';
    mt.textContent = (role === 'user' ? (ev.via === 'voice' ? '🎤 ' : '⌨ ') : '') + hhmm(ev.ts);
    el.appendChild(mt);
  }
  if(typingEl) log.insertBefore(el, typingEl); else log.appendChild(el);
  if(scroll && stick) requestAnimationFrame(toBottom);
}

function refreshStatus(){
  $('orb').dataset.s = state;
  $('status').textContent = (state === 'working' && label) ? label : (STATUS[state] || state);
  $('mic').classList.toggle('on', state === 'listening');
  const busy = state === 'thinking' || state === 'working';
  if(busy && !typingEl){
    typingEl = document.createElement('div'); typingEl.className = 'typing';
    typingEl.innerHTML = '<div class="dots"><i></i><i></i><i></i></div><span></span>';
    log.appendChild(typingEl); if(nearBottom()) requestAnimationFrame(toBottom);
  }
  if(typingEl){ if(busy) typingEl.lastChild.textContent = label || 'думаю…'; else { typingEl.remove(); typingEl = null; } }
}

function handle(m){
  if(typeof m.name === 'string'){ userName = m.name; const e = document.querySelector('#empty b'); if(e) e.textContent = greet(); }
  if('history' in m){
    log.innerHTML = ''; typingEl = null;
    if(m.history.length){ m.history.forEach(e => add(e, false)); requestAnimationFrame(toBottom); } else showEmpty();
  }
  if(m.chat) add(m.chat);
  if(typeof m.level === 'number') $('orb').style.transform = `scale(${1 + Math.min(1, m.level) * 0.22})`;
  if('perm' in m){
    perm = m.perm; $('permBox').style.display = perm ? 'block' : 'none';
    if(perm) $('permText').textContent = 'Разрешить: ' + perm.text + ' ?';
  }
  if(m.state){ state = m.state; label = m.label || ''; refreshStatus(); }
}
window.__handle = handle;     // test hook

function connect(){
  try { ws = new WebSocket('ws://127.0.0.1:8765'); } catch(e){ return setTimeout(connect, 1500); }
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch(err){ console.log('chat handle error', err); } };
  ws.onclose = () => { ws = null; state = 'offline'; label = ''; refreshStatus(); setTimeout(connect, 1500); };
}
function send(){
  const v = $('inp').value.trim(); if(!v || !ws || ws.readyState !== 1) return;
  $('inp').value = '';
  ws.send(JSON.stringify({ cmd:'text', text:v }));
  requestAnimationFrame(toBottom);
}
$('send').onclick = send;
$('inp').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); send(); } });
$('mic').onclick = () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ cmd:'toggle' }));
const answer = ok => { if(perm && ws) ws.send(JSON.stringify({ cmd:'perm', id:perm.id, allow:ok })); };
$('yes').onclick = () => answer(true); $('no').onclick = () => answer(false);
$('close').onclick = () => window.api.closeChat();
window.addEventListener('keydown', e => { if(e.key === 'Escape' || (e.metaKey && e.key === 'w')) window.api.closeChat(); });
showEmpty(); refreshStatus(); connect();
setTimeout(() => $('inp').focus(), 150);
</script>
</body></html>
